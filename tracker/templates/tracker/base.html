<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#008069">
<title>{% block title %}Medicines{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<style>
  :root {
    --green: #008069; --green-dark: #006b58; --accent: #25d366;
    --bg: #ffffff; --panel: #f0f2f5; --text: #111b21; --muted: #667781;
    --line: #e9edef; --avatar: #dfe5e7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --green: #202c33; --green-dark: #202c33; --bg: #111b21; --panel: #202c33;
            --text: #e9edef; --muted: #8696a0; --line: #222d34; --avatar: #2a3942; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  .app { max-width: 640px; margin: 0 auto; min-height: 100%; position: relative;
         background: var(--bg); }
  header { background: var(--green); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
           position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; flex: 1; }
  header a.back { color: #fff; text-decoration: none; font-size: 26px; line-height: 1; }
  .search { background: var(--bg); padding: 8px 12px; position: sticky;
            top: calc(52px + env(safe-area-inset-top)); z-index: 4; }
  .search input { width: 100%; border: 0; border-radius: 10px; background: var(--panel);
                  color: var(--text); padding: 10px 14px; font-size: 16px; outline: none; }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
  .avatar { width: 49px; height: 49px; border-radius: 50%; background: var(--avatar);
            display: grid; place-items: center; font-size: 22px; flex: none; }
  .meta { flex: 1; min-width: 0; padding-bottom: 10px; border-bottom: 1px solid var(--line);
          margin-bottom: -10px; padding-top: 2px; }
  .meta b { display: block; font-weight: 500; font-size: 17px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; }
  .meta span { color: var(--muted); font-size: 14px; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; display: block; }
  .empty { text-align: center; color: var(--muted); padding: 48px 24px; }
  .fabs { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(20px + env(safe-area-inset-bottom));
          display: flex; flex-direction: column; align-items: flex-end; gap: 14px; z-index: 6; }
  .fab { border: 0; text-decoration: none; color: #fff; background: var(--accent);
         box-shadow: 0 3px 8px rgba(0,0,0,.3); display: grid; place-items: center; }
  .fab.big { width: 58px; height: 58px; border-radius: 16px; font-size: 26px; }
  .fab.small { width: 46px; height: 46px; border-radius: 14px; font-size: 20px; background: var(--panel); color: var(--text); }
  .delete-medicine { flex: none; border: 0; border-radius: 50%; width: 36px; height: 36px;
    background: transparent; color: var(--muted); font-size: 26px; line-height: 1; cursor: pointer; }
  .delete-medicine:hover, .delete-medicine:focus-visible { background: #ffebee; color: #c62828; }
  .delete-medicine:disabled { opacity: .5; cursor: wait; }
  form { padding: 16px; display: grid; gap: 16px; }
  form p { margin: 0; display: grid; gap: 6px; }
  form label { color: var(--green); font-size: 14px; }
  @media (prefers-color-scheme: dark) { form label { color: var(--accent); } }
  form input, form select { width: 100%; font-size: 17px; padding: 8px 2px; color: var(--text);
        background: transparent; border: 0; border-bottom: 2px solid var(--line); outline: none; border-radius: 0; }
  form input:focus, form select:focus { border-color: var(--accent); }
  form select option { background: var(--bg); }
  .errorlist { margin: 0; padding: 0; list-style: none; color: #ea0038; font-size: 14px; }
  .save { background: var(--accent); color: #fff; border: 0; border-radius: 24px; padding: 13px;
          font-size: 16px; font-weight: 600; }
  .hint { padding: 0 16px; color: var(--muted); font-size: 14px; }
  .hint a { color: var(--green); }
  .modal-content { color: #111b21; }
  .modal-header { border-bottom-color: #e9edef; }
  .modal-footer { border-top-color: #e9edef; }
  .select2-container { width: 100% !important; }
  .select2-container--default .select2-selection--single { height: 38px; border-color: #dee2e6; }
  .select2-container--default .select2-selection--single .select2-selection__rendered { line-height: 36px; }
  .select2-container--default .select2-selection--single .select2-selection__arrow { height: 36px; }
  @media (prefers-color-scheme: dark) { .hint a { color: var(--accent); } }
</style>
{% block manifest %}{% endblock %}
</head>
<body>
<div class="app">{% block content %}{% endblock %}</div>
</body>
</html>
